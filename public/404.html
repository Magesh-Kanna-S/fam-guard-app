<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B3A2E" />
    <meta name="description" content="FAM-GUARD - Smart Grain Storage Companion. Protecting Every Grain, Empowering Every Home." />
    <title>FAM-GUARD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- GitHub Pages SPA fallback: this 404.html is served in place of any
         missing route. We just re-render index.html; React Router isn't used
         (the app uses state-based routing) so this is enough. The workflow
         also copies dist/index.html to dist/404.html on each build for the
         same reason. -->
    <style>
      body { margin:0; background:#1B3A2E; color:#fff; font-family: 'Inter', system-ui, sans-serif; }
      .fg-loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1rem; }
      .fg-logo { width:88px; height:88px; background:#fff; border-radius:1.75rem; display:flex; align-items:center; justify-content:center; font-size:2.5rem; color:#C87A2A; box-shadow:0 25px 50px rgba(0,0,0,.4); }
      .fg-tagline { color:#E8A33D; font-weight:700; letter-spacing:.1em; font-size:.7rem; text-transform:uppercase; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fg-loader">
        <div class="fg-logo"><i class="fa-solid fa-warehouse"></i></div>
        <div class="fg-tagline">Loading FAM-GUARD…</div>
      </div>
    </div>
    <!-- The deploy workflow replaces this with the built index.html copy. -->
    <script type="module" src="./assets/index.js"></script>
  </body>
</html>
